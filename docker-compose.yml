version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: phoenixeximm_mongodb
    restart: always
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    profiles:
      - localmongo

  backend:
    build: ./backend
    container_name: phoenixeximm_backend
    restart: always
    ports:
      - "5000:5000"
    # Pass secrets via env_file so Atlas URIs with $ & ? are not re-interpolated by Compose
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: phoenixeximm_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
  mongodb_data:
