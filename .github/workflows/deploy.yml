name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            if [ -d /home/${{ secrets.EC2_USER }}/phoenix-eximm ]; then
              cd /home/${{ secrets.EC2_USER }}/phoenix-eximm
              sudo docker compose down || true
              cd ..
              sudo rm -rf phoenix-eximm
            fi

            # Free disk (keep named volumes so Mongo data survives)
            sudo docker builder prune -af || true
            sudo docker system prune -af || true
            sudo journalctl --vacuum-time=1d || true
            sudo apt-get clean || true
            df -h

            mkdir -p /home/${{ secrets.EC2_USER }}/phoenix-eximm

      - name: Delete .git directory before copy
        run: rm -rf .git
        
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/${{ secrets.EC2_USER }}/phoenix-eximm"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/phoenix-eximm

            # Quote values — Atlas URIs contain & ? = which break unquoted .env parsing
            {
              echo "MONGO_URI=\"${{ secrets.MONGO_URI }}\""
              echo "JWT_SECRET=\"${{ secrets.JWT_SECRET }}\""
              echo "ADMIN_USER=\"${{ secrets.ADMIN_USER }}\""
              echo "ADMIN_PASS=\"${{ secrets.ADMIN_PASS }}\""
            } > .env

            # Only rewrite localhost → docker service name. Leave Atlas untouched.
            sed -i 's|mongodb://localhost:27017|mongodb://mongodb:27017|g' .env
            sed -i 's|mongodb://127.0.0.1:27017|mongodb://mongodb:27017|g' .env

            if ! grep -q '^MONGO_URI=".\+"$' .env && ! grep -q '^MONGO_URI=.\+' .env; then
              echo "ERROR: GitHub secret MONGO_URI is empty" >&2
              exit 1
            fi

            echo "Using MONGO host:" $(grep '^MONGO_URI=' .env | sed -E 's|^MONGO_URI="?mongodb(\+srv)?://([^@/]+@)?||; s|[/?].*||; s|"$||')

            cp .env backend/.env

            # Tiny EC2 (~1GB RAM): add swap so vite build doesn't get OOM-killed
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 1G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=1024
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi
            sudo swapon /swapfile || true

            sudo sync || true
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null || true
            sudo docker compose down || true
            df -h
            free -h

            # Pull/start local mongo only if URI points at it; Atlas needs no local DB (saves RAM)
            export COMPOSE_PARALLEL_LIMIT=1
            USE_LOCAL_MONGO=0
            if grep -Eq '^MONGO_URI=mongodb://(mongodb|localhost|127\.0\.0\.1):27017' .env; then
              USE_LOCAL_MONGO=1
            fi

            if [ "$USE_LOCAL_MONGO" = "1" ]; then
              sudo docker compose pull mongodb
              sudo docker compose up -d mongodb
              sudo docker compose stop mongodb
            fi

            sudo docker compose build backend
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null || true
            sudo docker compose build frontend

            if [ "$USE_LOCAL_MONGO" = "1" ]; then
              sudo docker compose up -d
            else
              # Atlas / remote Mongo — do not start local mongodb container
              sudo docker compose up -d --no-deps backend frontend
            fi

            sleep 5
            sudo docker compose ps || true
            sudo docker logs phoenixeximm_backend --tail=50 || true

            # Wait until products API works (Mongo ready + seeded)
            ok=0
            for i in $(seq 1 40); do
              if curl -sf http://127.0.0.1:8080/api/products | grep -q '\['; then
                ok=1
                break
              fi
              echo "waiting for products API ($i)..."
              sleep 3
            done
            sudo docker compose ps
            sudo docker logs phoenixeximm_backend --tail=40 || true
            sudo docker logs phoenixeximm_mongodb --tail=20 || true
            test "$ok" = "1"
            curl -sf http://127.0.0.1:8080/ >/dev/null

            if ! command -v nginx &> /dev/null; then
              sudo apt-get update
              sudo apt-get install nginx -y
            fi

            echo 'server {' | sudo tee /etc/nginx/sites-available/phoenixeximm
            echo '    listen 80 default_server;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '    server_name phoenixeximm.com www.phoenixeximm.com;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '    location / {' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '        proxy_pass http://127.0.0.1:8080;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '        proxy_set_header Host $host;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '        proxy_set_header X-Real-IP $remote_addr;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '        proxy_set_header X-Forwarded-Proto $scheme;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '    }' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '}' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            sudo ln -sf /etc/nginx/sites-available/phoenixeximm /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo systemctl restart nginx

            if ! command -v certbot &> /dev/null; then
              sudo apt-get install certbot python3-certbot-nginx -y
            fi

            if [ ! -d /etc/letsencrypt/live/phoenixeximm.com ]; then
              sudo certbot --nginx -d phoenixeximm.com -d www.phoenixeximm.com --non-interactive --agree-tos --email admin@phoenixeximm.com --redirect
            fi
