name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            if [ -d /home/${{ secrets.EC2_USER }}/phoenix-eximm ]; then
              cd /home/${{ secrets.EC2_USER }}/phoenix-eximm
              sudo docker compose down || true
              cd ..
              sudo rm -rf phoenix-eximm
            fi
            sudo docker builder prune -af || true
            sudo docker system prune -af || true
            sudo journalctl --vacuum-time=1d || true
            mkdir -p /home/${{ secrets.EC2_USER }}/phoenix-eximm

      - name: Delete .git directory before copy
        run: rm -rf .git

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/${{ secrets.EC2_USER }}/phoenix-eximm"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_MONGO_URI: ${{ secrets.MONGO_URI }}
          DEPLOY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_ADMIN_USER: ${{ secrets.ADMIN_USER }}
          DEPLOY_ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          envs: DEPLOY_MONGO_URI,DEPLOY_JWT_SECRET,DEPLOY_ADMIN_USER,DEPLOY_ADMIN_PASS
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/phoenix-eximm

            if [ -z "$DEPLOY_MONGO_URI" ]; then
              echo "ERROR: GitHub secret MONGO_URI is empty"
              exit 1
            fi

            # Atlas cluster in the secret is dead (DNS NXDOMAIN). Use local Docker Mongo so the site works.
            # When you create a new Atlas cluster, put the new URI in the secret and we can switch back.
            EFFECTIVE_MONGO_URI="mongodb://mongodb:27017/phoenixeximm"
            case "$DEPLOY_MONGO_URI" in
              mongodb://mongodb:*|mongodb://localhost:*|mongodb://127.0.0.1:*)
                EFFECTIVE_MONGO_URI="$DEPLOY_MONGO_URI"
                ;;
            esac
            # If secret is Atlas but hostname resolves, use it; otherwise force local
            if echo "$DEPLOY_MONGO_URI" | grep -q 'mongodb+srv://\|mongodb.net'; then
              ATLAS_HOST=$(echo "$DEPLOY_MONGO_URI" | sed -E 's#^mongodb(\+srv)?://([^@]+@)?##' | cut -d/ -f1 | cut -d? -f1)
              if getent hosts "$ATLAS_HOST" >/dev/null 2>&1 || nslookup "$ATLAS_HOST" 8.8.8.8 2>/dev/null | grep -q 'Address:'; then
                EFFECTIVE_MONGO_URI="$DEPLOY_MONGO_URI"
                echo "Atlas host resolves, using secret MONGO_URI"
              else
                echo "WARNING: Atlas host '$ATLAS_HOST' does not resolve (cluster deleted/paused). Using local Mongo instead."
                EFFECTIVE_MONGO_URI="mongodb://mongodb:27017/phoenixeximm"
              fi
            fi

            export DEPLOY_MONGO_URI="$EFFECTIVE_MONGO_URI"

            python3 - <<'PY'
            import os
            keys = [
              ("MONGO_URI", "DEPLOY_MONGO_URI"),
              ("JWT_SECRET", "DEPLOY_JWT_SECRET"),
              ("ADMIN_USER", "DEPLOY_ADMIN_USER"),
              ("ADMIN_PASS", "DEPLOY_ADMIN_PASS"),
            ]
            lines = []
            for out_key, env_key in keys:
              val = os.environ.get(env_key, "")
              val = val.replace("mongodb://localhost:27017", "mongodb://mongodb:27017")
              val = val.replace("mongodb://127.0.0.1:27017", "mongodb://mongodb:27017")
              esc = val.replace("\\", "\\\\").replace('"', '\\"')
              lines.append(f'{out_key}="{esc}"')
            open(".env", "w", encoding="utf-8").write("\n".join(lines) + "\n")
            print("Using MONGO_URI host:", os.environ.get("DEPLOY_MONGO_URI", "").split("@")[-1].split("/")[0])
            PY
            cp .env backend/.env

            if [ ! -f /swapfile ]; then
              sudo fallocate -l 1G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=1024
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi
            sudo swapon /swapfile || true

            sudo sync || true
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null || true
            sudo docker compose down || true
            df -h
            free -h

            export COMPOSE_PARALLEL_LIMIT=1
            echo "Building backend..."
            sudo docker compose build backend
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null || true
            echo "Building frontend..."
            sudo docker compose build frontend

            echo "Starting mongodb + backend + frontend..."
            # Stop mongo during was already not needed; start all with local mongo
            sudo docker compose up -d mongodb
            sleep 5
            sudo docker compose up -d --no-deps --force-recreate backend frontend
            echo "Containers started"
            sudo docker compose ps
            sleep 8
            sudo docker logs phoenixeximm_backend --tail=80 || true
            sudo docker logs phoenixeximm_mongodb --tail=20 || true

            ok=0
            for i in $(seq 1 40); do
              body=$(curl -s http://127.0.0.1:8080/api/products || true)
              echo "products attempt $i: ${body:0:120}"
              case "$body" in
                \[*) ok=1; break ;;
              esac
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "Products API did not become healthy"
              sudo docker logs phoenixeximm_backend --tail=100 || true
              exit 1
            fi

            curl -sf http://127.0.0.1:8080/ >/dev/null

            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install nginx -y
            fi

            echo 'server {' | sudo tee /etc/nginx/sites-available/phoenixeximm
            echo '    listen 80 default_server;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '    server_name phoenixeximm.com www.phoenixeximm.com;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '    location / {' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '        proxy_pass http://127.0.0.1:8080;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '        proxy_set_header Host $host;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '        proxy_set_header X-Real-IP $remote_addr;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '        proxy_set_header X-Forwarded-Proto $scheme;' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '    }' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            echo '}' | sudo tee -a /etc/nginx/sites-available/phoenixeximm
            sudo ln -sf /etc/nginx/sites-available/phoenixeximm /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo systemctl restart nginx

            if ! command -v certbot >/dev/null 2>&1; then
              sudo apt-get install certbot python3-certbot-nginx -y
            fi

            if [ ! -d /etc/letsencrypt/live/phoenixeximm.com ]; then
              sudo certbot --nginx -d phoenixeximm.com -d www.phoenixeximm.com --non-interactive --agree-tos --email admin@phoenixeximm.com --redirect
            fi
